<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cubito Aprende</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(160deg,#f5f0ff,#eaf8ff);padding:14px;color:#25233a}
.app{max-width:460px;margin:auto;background:#fff;border-radius:28px;padding:18px;box-shadow:0 12px 35px #0002}
h1{text-align:center;margin:0}.sub{text-align:center;color:#777}.pet{height:145px;background:#6d5dfc;border-radius:26px;display:grid;place-items:center;margin:12px 0}
.eyes{display:flex;gap:42px}.eye{width:23px;height:31px;background:#fff;border-radius:50%}.mouth{width:48px;height:18px;border-bottom:5px solid white;border-radius:50%}
#status{text-align:center;font-weight:bold;color:#6157a8;min-height:22px}.speech{background:#f3f2fa;padding:13px;border-radius:16px;text-align:center;min-height:45px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:14px;padding:14px 8px;font-weight:bold;font-size:15px;background:#eeeaff;color:#30286e;min-height:50px}button.primary{background:#6d5dfc;color:white}.wide{grid-column:1/-1}.hidden{display:none}
.visual{min-height:145px;background:#f7f7fa;border-radius:18px;margin:12px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.circle{width:100px;height:100px;border-radius:50%;background:#e53935}.square{width:100px;height:100px;background:#3978e8}.triangle{width:0;height:0;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:100px solid #f3b72b}.big{font-size:60px;font-weight:bold}.emoji{font-size:70px}.points{text-align:center;color:#6157a8;font-weight:bold;margin-top:12px}.small{text-align:center;color:#888;font-size:12px;margin-top:8px}
</style></head>
<body><main class="app">
<h1>🤖 Cubito Aprende</h1><div class="sub">Aprendemos jugando y hablando</div>
<div class="pet"><div><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div></div></div>
<div id="status">Preparando...</div><div id="speech" class="speech">Elige un nivel para comenzar.</div>

<section id="levels"><h2>¿Qué quieres aprender?</h2><div class="grid">
<button class="primary" onclick="nivel('preescolar')">🧸 Preescolar</button>
<button class="primary" onclick="nivel('primaria')">📚 Primaria</button></div></section>

<section id="topics" class="hidden"><h2 id="levelTitle"></h2><div id="topicButtons" class="grid"></div>
<button class="wide" onclick="show('levels')">⬅️ Cambiar nivel</button></section>

<section id="lesson" class="hidden"><h2 id="topicTitle"></h2><div id="desc"></div><div id="visual" class="visual"></div>
<div class="grid"><button class="primary wide" onclick="escuchar()">🎤 HABLAR CON CUBITO</button><button onclick="repetir()">🔊 Repetir</button><button onclick="pregunta()">❓ Ejemplo</button></div>
<button class="wide" onclick="show('topics')">⬅️ Otros temas</button><div id="feedback"></div></section>
<div class="points" id="points">⭐ Puntos: 0</div><div class="small">Respuestas programadas, sin IA ni API.</div>
</main>
<script>
const D={
preescolar:{t:'🧸 Preescolar',x:{
colores:{n:'🎨 Colores',d:'Colores básicos.',v:'<div class="circle"></div><b>ROJO</b>',a:[
['rojo','Es rojo.','<div class="circle"></div><b>ROJO</b>'],['azul','Es azul.','<div class="circle" style="background:#3978e8"></div><b>AZUL</b>'],['amarillo','Es amarillo.','<div class="circle" style="background:#f4c430"></div><b>AMARILLO</b>'],['verde','Es verde.','<div class="circle" style="background:#42a85f"></div><b>VERDE</b>']]},
formas:{n:'🔷 Formas',d:'Formas geométricas.',v:'<div class="square"></div><b>CUADRADO</b>',a:[
['cuadrado','Un cuadrado tiene cuatro lados iguales.','<div class="square"></div><b>CUADRADO</b>'],['circulo','Un círculo es redondo y no tiene esquinas.','<div class="circle" style="background:#6d5dfc"></div><b>CÍRCULO</b>'],['triangulo','Un triángulo tiene tres lados.','<div class="triangle"></div><b>TRIÁNGULO</b>']]},
numeros:{n:'🔢 Números',d:'Números y sumas sencillas.',v:'<div class="big">1 2 3</div>',a:[
['dos mas dos','Dos más dos es cuatro.','<div class="big">2 + 2 = 4</div>'],['2 mas 2','Dos más dos es cuatro.','<div class="big">2 + 2 = 4</div>'],['uno mas uno','Uno más uno es dos.','<div class="big">1 + 1 = 2</div>']]},
animales:{n:'🐶 Animales',d:'Animales y sonidos.',v:'<div class="emoji">🐶</div><b>PERRO</b>',a:[
['perro','El perro suele decir guau.','<div class="emoji">🐶</div><b>PERRO — GUAU</b>'],['gato','El gato dice miau.','<div class="emoji">🐱</div><b>GATO — MIAU</b>'],['vaca','La vaca suele hacer muu.','<div class="emoji">🐮</div><b>VACA — MUU</b>']]},
letras:{n:'🔤 Letras',d:'Letras y palabras.',v:'<div class="big">A</div><b>AVIÓN</b>',a:[
['letra a','La A es una vocal. A de avión.','<div class="big">A</div><b>AVIÓN ✈️</b>'],['letra b','La B es una consonante. B de barco.','<div class="big">B</div><b>BARCO 🚢</b>'],['letra c','La C es una consonante. C de casa.','<div class="big">C</div><b>CASA 🏠</b>']]}}},
primaria:{t:'📚 Primaria',x:{
matematicas:{n:'🔢 Matemáticas',d:'Sumas, restas y multiplicaciones.',v:'<div class="big">2 + 2 = ?</div>',a:[
['dos mas dos','Dos más dos es cuatro.','<div class="big">2 + 2 = 4</div>'],['2 mas 2','Dos más dos es cuatro.','<div class="big">2 + 2 = 4</div>'],['cinco mas tres','Cinco más tres es ocho.','<div class="big">5 + 3 = 8</div>'],['10 menos 4','Diez menos cuatro es seis.','<div class="big">10 − 4 = 6</div>'],['3 por 4','Tres por cuatro es doce.','<div class="big">3 × 4 = 12</div>']]},
espanol:{n:'📖 Español',d:'Palabras, sílabas y vocales.',v:'<div class="big">A E I O U</div>',a:[
['vocales','Las vocales son A, E, I, O y U.','<div class="big">A E I O U</div>'],['silabas casa','Casa tiene dos sílabas: ca-sa.','<div class="big">CA-SA</div>']]},
ciencias:{n:'🔬 Ciencias',d:'Naturaleza, materia y energía.',v:'<div class="emoji">🌱</div><b>PLANTA</b>',a:[
['fotosintesis','La fotosíntesis permite a las plantas fabricar alimento usando luz, agua y dióxido de carbono.','<div class="emoji">☀️ + 💧 + 🌿</div>'],['estados de la materia','Los estados más conocidos son sólido, líquido y gas.','<div class="big">🧊 💧 💨</div>'],['gravedad','La gravedad atrae los objetos hacia otros objetos con masa.','<div class="big">🍎 ↓ 🌎</div>']]},
cuerpo:{n:'🫀 Cuerpo humano',d:'Partes y funciones del cuerpo.',v:'<div class="emoji">🧍</div>',a:[
['corazon','El corazón bombea sangre por todo el cuerpo.','<div class="emoji">❤️</div><b>CORAZÓN</b>'],['pulmones','Los pulmones nos ayudan a respirar.','<div class="emoji">🫁</div><b>PULMONES</b>'],['cerebro','El cerebro participa en el pensamiento y la memoria.','<div class="emoji">🧠</div><b>CEREBRO</b>']]},
geografia:{n:'🌎 Geografía',d:'México, continentes y planeta.',v:'<div class="emoji">🌎</div>',a:[
['capital de mexico','La capital de México es Ciudad de México.','<div class="emoji">🇲🇽</div><b>CIUDAD DE MÉXICO</b>'],['continentes','Los continentes son grandes extensiones de tierra.','<div class="emoji">🌎</div><b>CONTINENTES</b>']]},
espacio:{n:'🚀 Espacio',d:'Planetas y sistema solar.',v:'<div class="emoji">🪐</div>',a:[
['jupiter','Júpiter es el planeta más grande del sistema solar.','<div class="emoji">🪐</div><b>JÚPITER</b>'],['marte','Marte es conocido como el planeta rojo.','<div class="emoji">🔴</div><b>MARTE</b>'],['sol','El Sol es una estrella.','<div class="emoji">☀️</div><b>SOL</b>']]}}}};

let N='',T='',rec=null,points=0;
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function speak(t,cb){$('speech').textContent=t;$('status').textContent='🔊 Hablando...';if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-MX';u.rate=.94;u.pitch=1.08;u.onend=()=>{ $('status').textContent='🎤 Listo para escucharte';if(cb)cb()};speechSynthesis.speak(u)}else if(cb)cb()}
function show(id){['levels','topics','lesson'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}
function nivel(n){N=n;show('topics');$('levelTitle').textContent=D[n].t+' — elige un tema';let b=$('topicButtons');b.innerHTML='';Object.entries(D[n].x).forEach(([id,d])=>{let q=document.createElement('button');q.textContent=d.n;q.onclick=()=>tema(id);b.appendChild(q)});speak('Perfecto. Elige un tema de '+(n==='preescolar'?'preescolar':'primaria')+'.')}
function tema(id){T=id;let d=D[N].x[id];show('lesson');$('topicTitle').textContent=d.n;$('desc').textContent=d.d;$('visual').innerHTML=d.v;$('feedback').textContent='';speak('Elegiste '+d.n.replace(/^[^ ]+ /,'')+'. '+d.d+' Puedes preguntarme hablando.')}
function pregunta(){let q=T==='matematicas'?'¿Cuánto es dos más dos?':T==='colores'?'¿Cuál es el color rojo?':T==='formas'?'¿Cómo es un cuadrado?':'Hazme una pregunta sobre este tema.';speak(q,listen)}
function repetir(){speak($('speech').textContent)}
function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='⚠️ Usa Chrome para el micrófono';return}rec=new SR();rec.lang='es-MX';rec.interimResults=false;rec.continuous=false;rec.onstart=()=>$('status').textContent='🔴 Te escucho...';rec.onresult=e=>answer(e.results[0][0].transcript);rec.onerror=e=>$('status').textContent=e.error==='not-allowed'?'🎤 Permiso de micrófono bloqueado':'No te escuché';rec.start()}
function escuchar(){listen()}
function answer(txt){let t=norm(txt),d=D[N].x[T];for(let a of d.a){if(t.includes(norm(a[0]))){$('visual').innerHTML=a[2];$('feedback').textContent='✨ ¡Muy bien!';points++;$('points').textContent='⭐ Puntos: '+points;speak(a[1]);return}}if(T==='numeros'||T==='matematicas'){if((t.includes('dos')&&t.includes('mas')&&t.includes('dos'))||(t.includes('2')&&t.includes('mas')&&t.includes('2'))){$('visual').innerHTML='<div class="big">2 + 2 = 4</div>';speak('Dos más dos es cuatro.');return}}speak('Todavía no tengo esa pregunta programada. Prueba con otro ejemplo de este tema.')}
window.onload=()=>setTimeout(()=>speak('¡Hola! Soy Cubito. Aquí puedes aprender jugando y hablando. Puedes elegir preescolar o primaria. Después elige un tema y pregúntame. Yo te responderé hablando y también te mostraré una referencia en pantalla.'),500);
</script></body></html>
