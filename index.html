<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubito - Mascota habladora</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(160deg,#f7f1ff,#e9f7ff);display:flex;justify-content:center;align-items:center;padding:18px;color:#25233a}.app{width:min(430px,100%);background:#fff;border-radius:28px;padding:22px;box-shadow:0 14px 40px rgba(40,30,70,.15);text-align:center}h1{margin:0 0 4px;font-size:28px}.sub{margin:0 0 18px;color:#77738a}.pet{width:190px;height:190px;margin:0 auto 16px;border-radius:38px;background:#6d5dfc;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:inset 0 -12px 0 rgba(0,0,0,.08);transition:.2s}.pet.happy{transform:scale(1.05) rotate(-1deg)}.eyes{display:flex;gap:48px;margin-bottom:20px}.eye{width:25px;height:35px;border-radius:50%;background:#fff;position:relative}.eye:after{content:"";position:absolute;width:9px;height:13px;background:#25233a;border-radius:50%;left:8px;top:10px}.mouth{width:52px;height:22px;border-bottom:6px solid #fff;border-radius:0 0 50% 50%}.bubble{min-height:65px;background:#f3f2fa;border-radius:18px;padding:14px;font-size:16px;line-height:1.35;margin-bottom:15px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:15px;padding:14px 10px;font-size:16px;font-weight:700;background:#eeeaff;color:#312a73;cursor:pointer;min-height:52px}button:active{transform:scale(.97)}.talk{grid-column:1/-1;background:#6d5dfc;color:#fff;font-size:18px}.score{margin-top:15px;font-weight:700;color:#6157a8}.tiny{margin-top:10px;font-size:12px;color:#92909e}
</style>
</head>
<body>
<div class="app">
<h1>🤖 Cubito</h1>
<p class="sub">Háblame y aprendemos juntos</p>

<div class="pet" id="pet">
<div class="eyes"><div class="eye"></div><div class="eye"></div></div>
<div class="mouth"></div>
</div>

<div class="bubble" id="bubble" aria-live="polite">Presiona el micrófono y háblame. 🎤</div>

<div class="buttons">
<button class="talk" id="talkBtn" onclick="escuchar()">🎤 HABLAR CON CUBITO</button>
<button onclick="saludar()">👋 Saludar</button>
<button onclick="pregunta()">🧠 Pregúntame</button>
<button onclick="matematicas()">🔢 Matemáticas</button>
<button onclick="adivinanza()">🧩 Adivinanza</button>
</div>

<div class="score" id="score">⭐ Puntos: 0</div>
<div class="tiny">Primera versión: respuestas programadas, sin IA.</div>
</div>

<script>
let puntos=0, esperando="", reconocimiento=null;
const bubble=document.getElementById("bubble"), pet=document.getElementById("pet"), score=document.getElementById("score"), talkBtn=document.getElementById("talkBtn");

function hablar(t){
 bubble.textContent=t;
 if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const v=new SpeechSynthesisUtterance(t);
   v.lang="es-MX"; v.rate=.95; v.pitch=1.08;
   speechSynthesis.speak(v);
 }
}
function animar(){pet.classList.remove("happy");void pet.offsetWidth;pet.classList.add("happy")}
function decir(t){hablar(t);animar()}
function normalizar(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}

function escuchar(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){decir("Tu navegador no permite reconocimiento de voz en esta prueba. Prueba con Chrome.");return}
 if(reconocimiento){reconocimiento.stop();return}
 reconocimiento=new SR();
 reconocimiento.lang="es-MX";
 reconocimiento.interimResults=false;
 reconocimiento.maxAlternatives=1;
 talkBtn.textContent="🔴 ESCUCHANDO...";
 reconocimiento.onresult=e=>{
   const texto=e.results[0][0].transcript;
   procesar(texto);
 };
 reconocimiento.onerror=e=>{
   decir("No pude escucharte. Revisa el permiso del micrófono e inténtalo otra vez.");
 };
 reconocimiento.onend=()=>{
   talkBtn.textContent="🎤 HABLAR CON CUBITO";
   reconocimiento=null;
 };
 reconocimiento.start();
}

function procesar(texto){
 const t=normalizar(texto);
 if(esperando==="suma"){
   if(t.includes("5")||t.includes("cinco")){puntos++;score.textContent="⭐ Puntos: "+puntos;decir("¡Correcto! Dos más tres son cinco. 🎉")}
   else decir("Casi. La respuesta es cinco.");
   esperando=""; return;
 }
 if(esperando==="animal"){
   if(t.includes("gato")){puntos++;score.textContent="⭐ Puntos: "+puntos;decir("¡Muy bien! El gato dice miau. 🐱")}
   else decir("La respuesta es gato. 🐱");
   esperando=""; return;
 }
 if(t.includes("hola")||t.includes("buenas")){decir("¡Hola! Qué gusto escucharte. 😊");return}
 if(t.includes("como estas")||t.includes("cómo estás")){decir("¡Estoy muy bien! Listo para aprender contigo.");return}
 if(t.includes("quien eres")||t.includes("quién eres")){decir("Soy Cubito, tu pequeña mascota para aprender.");return}
 if(t.includes("que animal")||t.includes("qué animal")){preguntaAnimal();return}
 if(t.includes("matematic")||t.includes("suma")||t.includes("cuanto es")||t.includes("cuánto es")){matematicas();return}
 if(t.includes("chiste")){decir("¿Qué le dijo un cero a un ocho? ¡Bonito cinturón! 😂");return}
 if(t.includes("color")){decir("Una banana madura normalmente es amarilla. 💛");return}
 decir("Todavía no sé responder eso. Puedes preguntarme por animales, colores, matemáticas o decir hola.");
}

function saludar(){decir("¡Hola! Me da mucho gusto jugar contigo. Háblame para hacerme una pregunta.")}
function pregunta(){decir("Puedes preguntarme qué animal dice miau, cuánto es dos más tres o de qué color es una banana.")}
function preguntaAnimal(){esperando="animal";decir("¿Qué animal dice miau?")}
function matematicas(){esperando="suma";decir("¿Cuánto es dos más tres?")}
function adivinanza(){decir("Tengo cuatro patas y digo guau. ¿Qué soy?")}

if(!("SpeechRecognition" in window)&&!("webkitSpeechRecognition" in window)){
 talkBtn.textContent="🎤 MICRÓFONO (PRUEBA EN CHROME)";
}
</script>
</body>
</html>
