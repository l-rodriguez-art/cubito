<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b4be8">
<title>Cubito — Aprende jugando</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cubito">
<meta name="theme-color" content="#7b4be8">

<style>
:root{--ink:#28235d;--muted:#77729b;--pink:#ef63bd;--purple:#7b4be8;--lav:#eee6ff;--blue:#dff4ff;--mint:#e5faf4;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff5cc,#f1e4ff 48%,#dff8f3);min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer} .app{max-width:760px;margin:auto;min-height:100vh;padding:18px 14px 32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-weight:900;font-size:25px}.points{background:#fff;border-radius:24px;padding:10px 15px;box-shadow:0 8px 24px #5f3da022;font-weight:800}
.hero{border-radius:32px;padding:22px;background:linear-gradient(135deg,#f7dfff,#e4f5ff);box-shadow:0 12px 35px #49368a18;margin-bottom:16px}
.hero h1{font-size:34px;margin:0 0 6px}.hero p{margin:0;color:var(--muted);font-size:17px}
.name-box{background:#fff;border-radius:22px;padding:14px;display:flex;gap:10px;margin-top:16px;box-shadow:0 8px 20px #49368a12}
.name-box input{flex:1;border:2px solid #e7dcff;border-radius:15px;padding:12px;font-size:17px;outline:none}
.primary{background:linear-gradient(135deg,#8c53ec,#ee63bd);color:white;border-radius:16px;padding:12px 18px;font-weight:900}
.nav{display:flex;gap:9px;overflow:auto;padding:4px 1px 12px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{white-space:nowrap;background:#fff;border-radius:18px;padding:11px 14px;box-shadow:0 6px 18px #49368a14;font-weight:800}.nav button.active{background:#7b4be8;color:#fff}
.section{display:none}.section.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu-card{background:#fff;border-radius:25px;padding:17px;min-height:125px;text-align:left;box-shadow:0 10px 25px #49368a16;transition:.15s}.menu-card:active{transform:scale(.98)}.menu-card b{display:block;font-size:20px}.menu-card small{color:var(--muted)}
.practice{background:rgba(255,255,255,.72);border:1px solid #fff;border-radius:32px;padding:18px;box-shadow:0 12px 35px #49368a14}
.question{text-align:center;font-size:27px;font-weight:900;margin:12px 0 4px}.question-en{text-align:center;color:var(--muted);font-size:19px;margin-bottom:15px}
.main-card{background:linear-gradient(135deg,#f8e9ff,#e1f6ff);border-radius:28px;padding:22px;text-align:center;border:2px solid #fff;margin-bottom:16px}
.big-emoji{font-size:88px;line-height:1.05}.main-es{font-size:30px;font-weight:900;margin-top:6px}.main-en{font-size:22px;color:var(--muted);font-weight:800;margin-top:3px}
.listen{margin-top:14px;background:#fff;border-radius:18px;padding:11px 18px;font-weight:900;box-shadow:0 6px 16px #49368a12}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.option{background:#fff;border-radius:27px;padding:18px;text-align:center;box-shadow:0 10px 25px #49368a14;min-height:245px;transition:.15s}.option:active{transform:scale(.98)}
.option-emoji{font-size:64px}.option-es{font-size:24px;font-weight:900;margin-top:5px}.option-en{font-size:18px;color:var(--muted);font-weight:800;margin-top:3px}
.option-listen{background:#eee5ff;border-radius:16px;padding:10px;margin-top:14px;font-weight:800;width:100%}
.repeat{display:block;margin:18px auto 8px;background:var(--pink);color:white;border-radius:18px;padding:13px 24px;font-weight:900}
.progress{text-align:center;color:var(--muted);font-size:16px}.bar{height:9px;background:#e5def7;border-radius:99px;overflow:hidden;margin:7px auto;max-width:420px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ef63bd,#7b4be8);border-radius:99px}
.feedback{position:fixed;inset:0;background:#28235dcc;display:none;align-items:center;justify-content:center;z-index:50}.feedback.show{display:flex}.feedback-box{background:#fff;border-radius:32px;padding:34px 42px;text-align:center;box-shadow:0 25px 70px #0005}.mark{font-size:90px;font-weight:1000}.feedback.good .mark{color:#26b36a}.feedback.bad .mark{color:#ef4e68}.feedback-box h2{margin:5px 0;font-size:30px}.feedback-box p{color:var(--muted);font-weight:700}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:520px){.app{padding:12px 10px 28px}.hero h1{font-size:30px}.question{font-size:25px}.options{gap:10px}.option{padding:13px;min-height:220px}.option-emoji{font-size:55px}.option-es{font-size:21px}.option-en{font-size:16px}.big-emoji{font-size:76px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">✨ Cubito</div><div class="points">⭐ <span id="points">0</span></div></div>
  <div class="hero">
    <h1 id="hello">¡Hola!</h1>
    <p>Aprende español e inglés jugando.</p>
    <div class="name-box" id="nameBox"><input id="nameInput" placeholder="Escribe tu nombre"><button class="primary" id="saveName">Entrar</button></div>
  </div>
  <div class="nav" id="nav"></div>
  <div id="home" class="section active">
    <div class="grid" id="menu"></div>
    <button id="resetAll" style="display:block;width:100%;margin:18px 0 4px;background:#fff;border:2px solid #ffd0dc;color:#d94d72;border-radius:20px;padding:14px;font-weight:900;box-shadow:0 8px 20px #49368a12;">
      🗑️ Reiniciar todo
    </button>
  </div>
  <div id="practice" class="section">
    <div class="practice">
      <div id="sectionTitle" style="font-size:25px;font-weight:900;margin-bottom:8px"></div>
      <div class="main-card">
        <div class="big-emoji" id="mainEmoji">😊</div>
        <div class="main-es" id="mainEs"></div><div class="main-en" id="mainEn"></div>
        <button class="listen" id="listenMain">🔊 Escuchar nombre</button>
      </div>
      <div class="question" id="question"></div><div class="question-en" id="questionEn"></div>
      <div class="options" id="options"></div>
      <button class="repeat" id="repeat">↻ Repetir pregunta</button>
      <div class="progress">Actividad <span id="activity">1</span> de <span id="total">10</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
</div>

<div class="feedback" id="feedback"><div class="feedback-box"><div class="mark" id="mark">✓</div><h2 id="feedbackTitle"></h2><p id="feedbackText"></p></div></div>

const sections = [
  ["colors","🎨 Colores","¿Qué color es este?","What color is this?"],
  ["shapes","🔷 Formas","¿Qué forma es esta?","What shape is this?"],

];
let userName = localStorage.getItem("cubito_name") || "";
let points = Number(localStorage.getItem("cubito_points") || 0);
let currentKey = null, current = null, activity = 0, lock = false;

const $ = id => document.getElementById(id);
$("points").textContent = points;
if(userName){ $("hello").textContent = `¡Hola, ${userName}!`; $("nameBox").style.display="none"; }

function speak(es,en){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const a = new SpeechSynthesisUtterance(es); a.lang="es-MX"; a.rate=.88;
  const b = new SpeechSynthesisUtterance(en); b.lang="en-US"; b.rate=.88;
  a.onend=()=>speechSynthesis.speak(b); speechSynthesis.speak(a);
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function save(){localStorage.setItem("cubito_points",String(points)); if(userName)localStorage.setItem("cubito_name",userName)}

function buildNav(){
  $("nav").innerHTML = `<button data-home="1">⌂ Inicio</button>` + sections.map(s=>`<button data-sec="${s[0]}">${s[1]}</button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>b.dataset.home?goHome():start(b.dataset.sec));
}
function buildMenu(){
  $("menu").innerHTML = sections.map(s=>`<button class="menu-card" data-sec="${s[0]}"><span style="font-size:34px">${s[1].split(" ")[0]}</span><b>${s[1].substring(s[1].indexOf(" ")+1)}</b><small>Español + English</small></button>`).join("");
  $("menu").querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>start(b.dataset.sec));
}
function goHome(){
  $("home").classList.add("active"); $("practice").classList.remove("active");
}
function start(key){
  currentKey=key; activity=0;
  $("home").classList.remove("active"); $("practice").classList.add("active");
  next();
}
function normalize(x){return String(x).normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toLowerCase().trim()}
function makeRound(){
  const arr=shuffle(DATA[currentKey]);
  const item=arr[0], other=arr.find(x=>normalize(x[0])!==normalize(item[0])) || arr[1];
  current={item,other};
}
function next(){
  if(lock) return;
  activity++;
  makeRound();
  const s=sections.find(x=>x[0]===currentKey);
  $("sectionTitle").textContent=s[1];
  $("question").textContent=s[2]; $("questionEn").textContent=s[3];
  $("mainEmoji").textContent=current.item[2];
  $("mainEs").textContent=current.item[0]; $("mainEn").textContent=current.item[1];
  const opts=shuffle([current.item,current.other]);
  $("options").innerHTML=opts.map((x,i)=>`
    <div class="option" data-answer="${i}">
      <div class="option-emoji">${x[2]}</div>
      <div class="option-es">${x[0]}</div>
      <div class="option-en">${x[1]}</div>
      <button class="option-listen" type="button" data-listen="${i}">🔊 Escuchar<br>Español + English</button>
    </div>`).join("");
  // Avoid nested-button click problems by making the outer cards div-like buttons via delegated handler.
  const optionEls=[...$("options").querySelectorAll(".option")];
  optionEls.forEach((el,idx)=>{
    el.onclick=(ev)=>{
      if(ev.target.closest(".option-listen")) return;
      answer(opts[idx]);
    };
    el.querySelector(".option-listen").onclick=(ev)=>{ev.stopPropagation(); speak(opts[idx][0],opts[idx][1]);};
  });
  $("listenMain").onclick=()=>speak(current.item[0],current.item[1]);
  $("activity").textContent=activity;
  $("total").textContent=DATA[currentKey].length;
  $("bar").style.width=Math.min(100,(activity/DATA[currentKey].length)*100)+"%";
}
function answer(x){
  if(lock) return;
  lock=true;
  const good=normalize(x[0])===normalize(current.item[0]);
  if(good){points++;save();$("points").textContent=points;showFeedback(true);}
  else showFeedback(false);
}
function showFeedback(good){
  $("feedback").className="feedback show "+(good?"good":"bad");
  $("mark").textContent=good?"✓":"✕";
  $("feedbackTitle").textContent=good?"¡Bien hecho!":"¡Ups! Inténtalo otra vez";
  $("feedbackText").textContent=good?`${current.item[0]} — ${current.item[1]}`:"Vamos a intentarlo de nuevo";
  if(good)speak(current.item[0],current.item[1]);
  setTimeout(()=>{
    $("feedback").classList.remove("show");
    lock=false;
    if(good) next(); else renderSame();
  },good?1500:1700);
}
function renderSame(){
  const s=sections.find(x=>x[0]===currentKey);
  $("question").textContent=s[2]; $("questionEn").textContent=s[3];
  $("mainEmoji").textContent=current.item[2]; $("mainEs").textContent=current.item[0]; $("mainEn").textContent=current.item[1];
  const opts=shuffle([current.item,current.other]);
  $("options").innerHTML=opts.map((x,i)=>`
    <div class="option" data-answer="${i}">
      <div class="option-emoji">${x[2]}</div><div class="option-es">${x[0]}</div><div class="option-en">${x[1]}</div>
      <button class="option-listen" type="button">🔊 Escuchar<br>Español + English</button>
    </div>`).join("");
  [...$("options").querySelectorAll(".option")].forEach((el,idx)=>{
    el.onclick=()=>answer(opts[idx]);
    el.querySelector(".option-listen").onclick=(ev)=>{ev.stopPropagation();speak(opts[idx][0],opts[idx][1]);};
  });
  $("listenMain").onclick=()=>speak(current.item[0],current.item[1]);
}
$("resetAll").onclick=()=>{
  const ok = confirm("¿Quieres reiniciar todo? Se borrará el nombre, los puntos y el progreso guardado en este teléfono.");
  if(!ok) return;
  localStorage.removeItem("cubito_name");
  localStorage.removeItem("cubito_points");
  location.reload();
};
$("saveName").onclick=()=>{
  const v=$("nameInput").value.trim();
  if(!v){$("nameInput").focus();return}
  userName=v;save();$("hello").textContent=`¡Hola, ${userName}!`;$("nameBox").style.display="none";
};
$("repeat").onclick=()=>{if(current)speak(current.item[0],current.item[1]);};
buildNav();buildMenu();
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
